services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music_for_the_ages
    ports:
      - "5434:5432"
    volumes:
      - chart_archive_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music_for_the_ages"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  chart_archive_pg:
